name: CI - TODO Project

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: todo_test_db
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify
        env:
          POSTGRES_URL: jdbc:postgresql://localhost:5432/todo_test_db
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: todo_password123
          JWT_SECRET: CeNPqrkXY7v91xbFXfZpkI6EKLwAyIchWAWqes1C8jp
          JWT_EXPIRATION: 3600000
          JWT_REFRESH: 604800000